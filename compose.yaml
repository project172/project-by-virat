version: '3.8'

services:
  phishing-detector:
    build: ..
    container_name: phishing-detector
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-your-production-secret-key-change-this}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-secret-key-change-this}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DATABASE_URL=sqlite:///phishing_detector.db
      - LOG_LEVEL=INFO
      - RATE_LIMIT=100
      - RATE_LIMIT_PERIOD=60
    volumes:
      - ../models:/app/models
      - ../logs:/app/logs
      - ../phishing_detector.db:/app/phishing_detector.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - phishing-network

  nginx:
    image: nginx:alpine
    container_name: phishing-detector-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../static:/usr/share/nginx/html/static:ro
    depends_on:
      - phishing-detector
    restart: unless-stopped
    networks:
      - phishing-network

networks:
  phishing-network:
    driver: bridge